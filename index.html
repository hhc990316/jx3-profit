<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑网三魔盒 · 技艺精力收益测算</title>
<style>
:root {
  /* 水墨风 · 宣纸为底、浓淡墨为主、朱砂仅点睛 */
  --bg: #f5f3ee;
  --card: #fdfcf8;
  --card-2: #ffffff;
  --ink: #2a2a28;
  --ink-2: #4a4a47;
  --ink-3: #6f6e68;
  --text: #3a3a37;
  --text-2: #8c8a83;
  --text-3: #b5b3ac;
  --border: #e6e3da;
  --border-strong: #d4d0c4;
  --up: #c25b4b;      /* 涨：赭红，内敛不刺眼 */
  --down: #6f8a6a;    /* 跌：青灰绿 */
  --accent: #3d3d3a;  /* 主强调 = 墨色（替代朱砂红）*/
  --accent-2: #2a2a28;
  --accent-bg: #efeee9;
  --cinnabar: #b04a3a;   /* 朱砂，仅印章/第一名等极小面积使用 */
  --cinnabar-bg: #f6ece8;
  --gold: #a8863c;
  --gold-bg: #f3ecdb;
  --warn: #a0803c;
  --warn-bg: #f4eedd;
  --radius: 10px;
  --shadow: 0 2px 14px rgba(60, 55, 45, 0.06);
  --shadow-hover: 0 6px 22px rgba(60, 55, 45, 0.12);
  --font-display: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  background-image:
    radial-gradient(circle at 14% 6%, rgba(120,116,105,0.10) 0%, transparent 40%),
    radial-gradient(circle at 86% 94%, rgba(120,116,105,0.08) 0%, transparent 42%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35) 0%, transparent 70%);
  color: var(--text);
  font-size: 14px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.3px;
}
.container { max-width: 1080px; margin: 0 auto; padding: 28px 20px; }

/* 头部 */
.header {
  padding: 26px 8px 16px; position: relative;
  margin: -8px -8px 0;
  padding: 30px 24px 18px;
  border-radius: 12px;
  overflow: hidden;
}
/* 水墨晕染底色：淡墨在宣纸上晕开的不规则墨迹 */
.header::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 60% 90% at 18% 30%, rgba(120,116,105,0.14) 0%, transparent 70%),
    radial-gradient(ellipse 45% 70% at 78% 22%, rgba(120,116,105,0.10) 0%, transparent 72%),
    radial-gradient(ellipse 55% 80% at 60% 82%, rgba(120,116,105,0.08) 0%, transparent 70%),
    radial-gradient(circle at 8% 85%, rgba(176,74,58,0.05) 0%, transparent 45%);
  filter: blur(2px);
}
.header > * { position: relative; z-index: 1; }
.header::after {
  content: ""; display: block; height: 1px; margin-top: 16px;
  background: linear-gradient(90deg, transparent, var(--ink-3) 25%, var(--ink-3) 75%, transparent);
  opacity: 0.45;
}
.header h1 {
  font-family: var(--font-display);
  font-size: 24px; font-weight: 700; letter-spacing: 1px;
  color: var(--ink); position: relative; display: inline-block;
}
.header h1::before {
  content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 22px; border-radius: 2px;
  background: var(--cinnabar); opacity: 0.85;
}
.header .sub { color: var(--text-2); font-size: 13px; margin-top: 8px; letter-spacing: 1px; }
.badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.badge {
  font-size: 12px; color: var(--text-2);
  background: var(--card-2); border: 1px solid var(--border);
  padding: 5px 14px; border-radius: 6px;
  letter-spacing: 0.5px;
  box-shadow: 0 1px 3px rgba(80,60,30,.05);
}

/* 面板卡片 */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  box-shadow: var(--shadow);
  position: relative;
}
.card h2 {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700; margin-bottom: 16px;
  letter-spacing: 1px; color: var(--ink);
  padding-left: 12px; position: relative;
}
.card h2::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 2px; border-radius: 1px; background: var(--ink);
  opacity: 0.7;
}

/* 等级输入区 */
.craft-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.craft-input {
  border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--card-2);
  box-shadow: 0 2px 8px rgba(80,60,30,.05);
  transition: box-shadow .2s, transform .2s;
}
.craft-input:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.craft-input .craft-name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; letter-spacing: 1px; }
.craft-input .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.craft-input input[type=number] {
  width: 100%; padding: 10px 12px; font-size: 16px;
  border: 1px solid var(--border); border-radius: 10px; outline: none;
  background: var(--card); color: var(--text); transition: border-color .2s, box-shadow .2s;
}
.craft-input input[type=number]:focus { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-bg); }
.craft-input label.switch {
  display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-2); cursor: pointer;
  padding: 8px 0; margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.craft-input label.switch input[type=checkbox] {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.craft-input label.switch .toggle-track {
  width: 44px; height: 25px; border-radius: 25px; flex-shrink: 0;
  background: #dcd2bf; position: relative; transition: background .25s;
  pointer-events: none;
}
.craft-input label.switch .toggle-track::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 21px; height: 21px; border-radius: 50%; background: #fff;
  transition: transform .25s; box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.craft-input label.switch input[type=checkbox]:checked + .toggle-track {
  background: var(--ink-2);
}
.craft-input label.switch input[type=checkbox]:checked + .toggle-track::after {
  transform: translateX(19px);
}

/* 控制按钮行 */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.btn {
  padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card-2); cursor: pointer; font-size: 13px; color: var(--text);
  transition: all .2s; letter-spacing: 1px;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
select.filter {
  padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card-2); font-size: 13px; outline: none; color: var(--text);
}

/* 统计卡 */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
.metric {
  background: var(--card-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.metric::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--ink-2), var(--ink-3), transparent);
  opacity: 0.55;
}
.metric .label { font-size: 12px; color: var(--text-2); letter-spacing: 1px; }
.metric .value { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.metric .unit { font-size: 12px; color: var(--text-3); }

/* 收益榜列表 */
.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-item {
  border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  background: var(--card-2); cursor: pointer;
  box-shadow: 0 2px 8px rgba(80,60,30,.05);
  transition: box-shadow .2s, transform .2s, border-color .2s;
}
.rank-item:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); border-color: var(--border-strong); }
.rank-item .top { display: flex; align-items: center; gap: 12px; }
.rank-num {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; background: var(--bg); color: var(--text-2);
  font-family: var(--font-display);
}
.rank-num.top1 { background: var(--cinnabar); color: #fff; }
.rank-num.top2 { background: #e8e6e0; color: var(--ink-3); }
.rank-num.top3 { background: #ece6d8; color: #9a7a38; }
.rank-item .name { font-weight: 600; font-size: 14px; flex: 1; letter-spacing: 0.5px; }
.rank-item .craft-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 6px; flex-shrink: 0;
  letter-spacing: 1px;
}
.rank-item .profit { text-align: right; }
.rank-item .profit .big { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rank-item .profit .small { font-size: 11px; color: var(--text-3); }
.pos { color: var(--up); }
.neg { color: var(--down); }

.rank-item .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--text-2); }
.rank-item .meta .liq-good { color: var(--down); }
.rank-item .meta .liq-mid { color: var(--warn); }
.rank-item .meta .liq-bad { color: var(--up); }
.liq-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
.liq-good { background: #edf1e9; color: #6f8a6a; }
.liq-mid { background: #f3eedd; color: #a0803c; }
.liq-bad { background: #f6ece8; color: #b04a3a; }

/* 展开详情 */
.detail {
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
  display: none;
}
.detail.open { display: block; }
.detail h4 { font-size: 12px; color: var(--text-2); margin: 10px 0 6px; letter-spacing: 1px; }
.detail table { width: 100%; border-collapse: collapse; font-size: 12px; }
.detail th, .detail td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
.detail th { color: var(--text-3); font-weight: 400; }
.detail td.num { text-align: right; font-variant-numeric: tabular-nums; }
.detail .summary { font-size: 13px; color: var(--text-2); }

/* 提示 */
.tip { font-size: 12px; color: var(--text-3); margin-top: 8px; }
.empty { text-align: center; color: var(--text-3); padding: 40px 0; }

/* 分类筛选按钮 */
.craft-filter { display: flex; flex-wrap: wrap; gap: 8px; }

/* 入场动画 */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
.header, .card, .metric {
  animation: riseIn var(--dur-base, 400ms) cubic-bezier(0.16, 1, 0.3, 1) both;
}
.card:nth-of-type(2) { animation-delay: 80ms; }
.card:nth-of-type(3) { animation-delay: 160ms; }
.metrics { animation-delay: 200ms; }

@media (max-width: 600px) {
  .rank-item .meta { gap: 8px; }
  .container { padding: 12px; }
  .header h1 { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>剑网三魔盒 · 技艺精力收益测算</h1>
    <div class="sub">输入你的技艺等级，看看做什么最赚精力</div>
    <div class="badge-row" id="badgeRow"></div>
  </div>

  <div class="card">
    <h2>你的技艺等级</h2>
    <div class="craft-inputs" id="craftInputs"></div>
    <div class="tip">专精：勾选表示该号已学习该技艺专精，可制作需要专精的配方。等级填你实际拥有的技艺等级，低于该等级的配方会被过滤掉。</div>
  </div>

  <div class="card">
    <h2>筛选与排序</h2>
    <div class="controls">
      <div class="craft-filter" id="craftFilter"></div>
    </div>
    <div class="controls" style="margin-top:10px;">
      <select class="filter" id="sortBy">
        <option value="profit_per_energy">按每点精力净利排序</option>
        <option value="profit">按单次净利排序</option>
        <option value="liquidity">按流动性排序</option>
      </select>
      <select class="filter" id="liqFilter">
        <option value="all">全部流动性</option>
        <option value="good">只看流动性好</option>
        <option value="ok">只看流动性中等以上</option>
      </select>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="card">
    <h2 id="rankTitle">收益榜</h2>
    <div class="rank-list" id="rankList"></div>
  </div>
</div>

<script>
const CRAFT_COLORS = {
  cooking: '#6f8a6a',      // 青灰绿（竹青）
  medicine: '#6b7f8e',     // 黛青（青黛）
  tailoring: '#8a6a5c',    // 赭石（浅绛）
  founding: '#a0803c',     // 藤黄赭
  furniture: '#7d6a8a',    // 紫檀灰
};
const CRAFT_NAMES = {
  cooking: '烹饪', medicine: '制药', tailoring: '缝纫',
  founding: '锻造', furniture: '梓匠',
};
const CRAFT_KEYS = ['cooking', 'medicine', 'tailoring', 'founding', 'furniture'];

let DATA = null;
let state = {
  levels: { cooking: 0, medicine: 0, tailoring: 0, founding: 0, furniture: 0 },
  expertise: { cooking: false, medicine: false, tailoring: false, founding: false, furniture: false },
  craftFilter: 'all',
  sortBy: 'profit_per_energy',
  liqFilter: 'all',
};

function fmtJin(v) {
  // v 单位是万分之一金，转换为金
  const jin = v / 10000;
  if (jin >= 10000) return (jin / 10000).toFixed(2) + '万';
  if (jin >= 1) return jin.toFixed(2);
  return jin.toFixed(4);
}
function fmtJin2(v) {
  const jin = v / 10000;
  return jin.toFixed(2);
}

function liquidityTag(count) {
  if (count >= 500) return { text: '充足', cls: 'liq-good' };
  if (count >= 50) return { text: '一般', cls: 'liq-mid' };
  return { text: '稀少', cls: 'liq-bad' };
}

function renderBadges() {
  if (!DATA) return;
  const el = document.getElementById('badgeRow');
  const t = new Date(DATA.generated_at * 1000);
  const timeStr = `${t.getMonth()+1}月${t.getDate()}日 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  el.innerHTML = '';
  const badges = [
    `区服：${DATA.server}`,
    `更新时间：${timeStr}`,
    `可计算配方：${DATA.recipes.length} 个`,
    `手续费：${(DATA.fee_rate*100).toFixed(0)}%`,
  ];
  badges.forEach(b => {
    const span = document.createElement('span');
    span.className = 'badge';
    span.textContent = b;
    el.appendChild(span);
  });
}

function renderCraftInputs() {
  const el = document.getElementById('craftInputs');
  el.innerHTML = '';
  CRAFT_KEYS.forEach(key => {
    const div = document.createElement('div');
    div.className = 'craft-input';
    const color = CRAFT_COLORS[key];
    div.innerHTML = `
      <div class="craft-name"><span class="dot" style="background:${color}"></span>${CRAFT_NAMES[key]}</div>
      <input type="number" min="0" max="50" placeholder="等级" data-key="${key}" value="${state.levels[key] || ''}">
      <label class="switch">
        <input type="checkbox" data-exp="${key}" ${state.expertise[key] ? 'checked' : ''}>
        <span class="toggle-track"></span>
        <span>专精</span>
      </label>
    `;
    el.appendChild(div);
  });

  el.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.key;
      state.levels[key] = parseInt(inp.value) || 0;
      update();
    });
  });
  el.querySelectorAll('label.switch').forEach(lb => {
    lb.addEventListener('click', (e) => {
      e.preventDefault(); // 阻止 label 默认联动，避免双重切换
      const cb = lb.querySelector('input[type=checkbox]');
      cb.checked = !cb.checked;
      const key = cb.dataset.exp;
      state.expertise[key] = cb.checked;
      update();
    });
  });
}

function renderCraftFilter() {
  const el = document.getElementById('craftFilter');
  el.innerHTML = '';
  const opts = [
    { key: 'all', name: '全部' },
    ...CRAFT_KEYS.map(k => ({ key: k, name: CRAFT_NAMES[k] })),
  ];
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (state.craftFilter === o.key ? ' active' : '');
    btn.textContent = o.name;
    btn.addEventListener('click', () => {
      state.craftFilter = o.key;
      renderCraftFilter();
      update();
    });
    el.appendChild(btn);
  });
}

function filterRecipes() {
  if (!DATA) return [];
  const rows = DATA.recipes.filter(r => {
    // 等级过滤
    const lvl = r.require_level || 0;
    if (lvl > (state.levels[r.craft] || 0)) return false;
    // 专精过滤
    if (r.need_expertise && !state.expertise[r.craft]) return false;
    // 分类过滤
    if (state.craftFilter !== 'all' && r.craft !== state.craftFilter) return false;
    // 流动性过滤
    if (state.liqFilter === 'good' && r.liquidity < 500) return false;
    if (state.liqFilter === 'ok' && r.liquidity < 50) return false;
    return true;
  });

  const sortKey = state.sortBy;
  rows.sort((a, b) => b[sortKey] - a[sortKey]);
  return rows;
}

function renderMetrics(rows) {
  const el = document.getElementById('metrics');
  if (rows.length === 0) {
    el.innerHTML = '';
    return;
  }
  const pos = rows.filter(r => r.profit > 0).length;
  const top = rows[0];
  const avg = rows.reduce((s, r) => s + r.profit_per_energy, 0) / rows.length;
  el.innerHTML = `
    <div class="metric"><div class="label">可做配方</div><div class="value">${rows.length}</div><div class="unit">个</div></div>
    <div class="metric"><div class="label">正收益</div><div class="value">${pos}</div><div class="unit">个</div></div>
    <div class="metric"><div class="label">最优配方</div><div class="value" style="font-size:16px">${top.name}</div><div class="unit">${fmtJin2(top.profit_per_energy)} 金/精力</div></div>
    <div class="metric"><div class="label">平均每精力净利</div><div class="value">${fmtJin2(avg)}</div><div class="unit">金</div></div>
  `;
}

function renderList(rows) {
  const el = document.getElementById('rankList');
  const title = document.getElementById('rankTitle');
  if (rows.length === 0) {
    title.textContent = '收益榜（无匹配配方）';
    el.innerHTML = '<div class="empty">没有符合当前等级的配方，试试提高等级或切换分类</div>';
    return;
  }
  title.textContent = `收益榜（共 ${rows.length} 个可做配方）`;
  el.innerHTML = '';
  rows.slice(0, 200).forEach((r, i) => {
    const liq = liquidityTag(r.liquidity);
    const isPos = r.profit >= 0;
    const div = document.createElement('div');
    div.className = 'rank-item';
    const rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    div.innerHTML = `
      <div class="top">
        <div class="rank-num ${rankCls}">${i+1}</div>
        <div class="name">${r.name}</div>
        <div class="craft-tag" style="background:${CRAFT_COLORS[r.craft]}18;color:${CRAFT_COLORS[r.craft]}">${r.craft_name}</div>
        <div class="profit">
          <div class="big ${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}${fmtJin2(r.profit_per_energy)}</div>
          <div class="small">金/精力</div>
        </div>
      </div>
      <div class="meta">
        <span>需等级 ${r.require_level || '-'}</span>
        ${r.need_expertise ? '<span>需专精</span>' : ''}
        <span>消耗精力 ${r.energy}</span>
        <span>单次净利 ${r.profit >= 0 ? '+' : ''}${fmtJin2(r.profit)} 金</span>
        <span class="${liq.cls}">流动性 ${liq.text}</span>
      </div>
      <div class="detail" data-id="${i}"></div>
    `;
    div.querySelector('.top').addEventListener('click', () => toggleDetail(div, r, i));
    el.appendChild(div);
  });
}

function toggleDetail(container, r, i) {
  const detail = container.querySelector('.detail');
  if (detail.classList.contains('open')) {
    detail.classList.remove('open');
    return;
  }
  detail.classList.add('open');
  if (detail.innerHTML) return;

  let matHtml = '';
  r.materials.forEach(m => {
    matHtml += `<tr><td>${m.name}</td><td class="num">${m.count}</td><td class="num">${fmtJin(m.unit_price)}</td><td class="num">${fmtJin(m.cost)}</td></tr>`;
  });
  let outHtml = '';
  r.outputs.forEach(o => {
    outHtml += `<tr><td>${o.name}</td><td class="num">${o.min}~${o.max}</td><td class="num">${fmtJin(o.unit_price)}</td><td class="num">${fmtJin(o.revenue)}</td></tr>`;
  });

  detail.innerHTML = `
    <div class="summary">
      材料成本 <b>${fmtJin2(r.material_cost)}</b> 金 · 成品产值 <b>${fmtJin2(r.expected_revenue)}</b> 金 · 
      扣手续费后净利 <b>${fmtJin2(r.net_revenue)}</b> 金
    </div>
    <h4>材料（${r.materials.length} 种）</h4>
    <table><thead><tr><th>材料</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>${matHtml}</tbody></table>
    <h4>产出（${r.outputs.length} 种）</h4>
    <table><thead><tr><th>成品</th><th>产出数量</th><th>单价</th><th>小计</th></tr></thead><tbody>${outHtml}</tbody></table>
  `;
}

function update() {
  const rows = filterRecipes();
  renderMetrics(rows);
  renderList(rows);
}

function init() {
  document.getElementById('sortBy').addEventListener('change', e => {
    state.sortBy = e.target.value;
    update();
  });
  document.getElementById('liqFilter').addEventListener('change', e => {
    state.liqFilter = e.target.value;
    update();
  });
}

fetch('recipe_data.json').then(res => res.json()).then(data => {
  DATA = data;
  renderBadges();
  renderCraftInputs();
  renderCraftFilter();
  init();
  update();
}).catch(err => {
  document.getElementById('rankList').innerHTML = '<div class="empty">数据加载失败，请稍后刷新重试</div>';
});
</script>
</body>
</html>
