<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搬砖小算盘 · 剑网三技艺精力收益测算</title>
<style>
:root {
  /* 水墨风 · 宣纸为底、浓淡墨为主、朱砂仅点睛 */
  --bg: #f5f3ee;
  --card: #fdfcf8;
  --card-2: #ffffff;
  --ink: #2a2a28;
  --ink-2: #4a4a47;
  --ink-3: #6f6e68;
  --text: #3a3a37;
  --text-2: #8c8a83;
  --text-3: #b5b3ac;
  --border: #e6e3da;
  --border-strong: #d4d0c4;
  --up: #c25b4b;      /* 涨：赭红，内敛不刺眼 */
  --down: #6f8a6a;    /* 跌：青灰绿 */
  --accent: #3d3d3a;  /* 主强调 = 墨色（替代朱砂红）*/
  --accent-2: #2a2a28;
  --accent-bg: #efeee9;
  --cinnabar: #b04a3a;   /* 朱砂，仅印章/第一名等极小面积使用 */
  --cinnabar-bg: #f6ece8;
  --gold: #a8863c;
  --gold-bg: #f3ecdb;
  --warn: #a0803c;
  --warn-bg: #f4eedd;
  --radius: 10px;
  --shadow: 0 2px 14px rgba(60, 55, 45, 0.06);
  --shadow-hover: 0 6px 22px rgba(60, 55, 45, 0.12);
  --font-display: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  background-image:
    radial-gradient(circle at 14% 6%, rgba(120,116,105,0.10) 0%, transparent 40%),
    radial-gradient(circle at 86% 94%, rgba(120,116,105,0.08) 0%, transparent 42%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.35) 0%, transparent 70%);
  color: var(--text);
  font-size: 14px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.3px;
}
.container { max-width: 1080px; margin: 0 auto; padding: 28px 20px; }

/* 头部 */
.header { padding: 26px 8px 16px; position: relative; overflow: visible; }
.ink-wash {
  position: absolute; left: -22px; top: 4px;
  width: min(680px, 94%); height: auto;
  pointer-events: none; z-index: 0;
}
.header h1, .header .sub, .header .badge-row { position: relative; z-index: 1; }
.header::after {
  content: ""; display: block; height: 1px; margin-top: 16px;
  background: linear-gradient(90deg, transparent, var(--ink-3) 25%, var(--ink-3) 75%, transparent);
  opacity: 0.45;
}
.header h1 {
  font-family: var(--font-display);
  font-size: 24px; font-weight: 700; letter-spacing: 1px;
  color: var(--ink); position: relative; display: inline-block;
}
.header h1::before {
  content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 22px; border-radius: 2px;
  background: var(--cinnabar); opacity: 0.85;
}
.header .sub { color: var(--text-2); font-size: 13px; margin-top: 8px; letter-spacing: 1px; }
/* 朱砂闲章 */
.seal {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--cinnabar); color: #fdfcf8;
  font-size: 12px; font-weight: 700; line-height: 1.15;
  writing-mode: vertical-rl; letter-spacing: 2px;
  padding: 5px 4px; border-radius: 4px; margin-left: 12px;
  transform: rotate(-4deg) translateY(2px);
  box-shadow: 0 1px 3px rgba(176,74,58,.28), inset 0 0 0 1px rgba(255,255,255,.25);
  vertical-align: middle; user-select: none;
}
.badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.badge {
  font-size: 12px; color: var(--text-2);
  background: var(--card-2); border: 1px solid var(--border);
  padding: 5px 14px; border-radius: 6px;
  letter-spacing: 0.5px;
  box-shadow: 0 1px 3px rgba(80,60,30,.05);
}

/* 面板卡片 */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
  box-shadow: var(--shadow);
  position: relative;
}
.card h2 {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700; margin-bottom: 16px;
  letter-spacing: 1px; color: var(--ink);
  padding-left: 12px; position: relative;
}
.card h2::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 2px; border-radius: 1px; background: var(--ink);
  opacity: 0.7;
}

/* 等级输入区 */
.craft-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.craft-input {
  border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--card-2);
  box-shadow: 0 2px 8px rgba(80,60,30,.05);
  transition: box-shadow .2s, transform .2s;
}
.craft-input:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.craft-input .craft-name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; letter-spacing: 1px; }
.craft-input .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.craft-input .craft-ico { width: 20px; height: 20px; display: inline-flex; flex-shrink: 0; }
.craft-input .craft-ico svg { width: 20px; height: 20px; }
.craft-input input[type=number] {
  width: 100%; padding: 10px 12px; font-size: 16px;
  border: 1px solid var(--border); border-radius: 10px; outline: none;
  background: var(--card); color: var(--text); transition: border-color .2s, box-shadow .2s;
}
.craft-input input[type=number]:focus { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-bg); }
.craft-input label.switch {
  display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--text-2); cursor: pointer;
  padding: 8px 0; margin-top: 2px;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.craft-input label.switch input[type=checkbox] {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.craft-input label.switch .toggle-track {
  width: 44px; height: 25px; border-radius: 25px; flex-shrink: 0;
  background: #dcd2bf; position: relative; transition: background .25s;
  pointer-events: none;
}
.craft-input label.switch .toggle-track::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 21px; height: 21px; border-radius: 50%; background: #fff;
  transition: transform .25s; box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.craft-input label.switch input[type=checkbox]:checked + .toggle-track {
  background: var(--ink-2);
}
.craft-input label.switch input[type=checkbox]:checked + .toggle-track::after {
  transform: translateX(19px);
}

/* 控制按钮行 */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.btn {
  padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card-2); cursor: pointer; font-size: 13px; color: var(--text);
  transition: all .2s; letter-spacing: 1px;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
select.filter {
  padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card-2); font-size: 13px; outline: none; color: var(--text);
}

/* 测算类型页签 */
.mode-tabs {
  display: flex; gap: 10px; margin: 0 8px 22px;
  padding: 6px; border-radius: 12px;
  background: var(--accent-bg); border: 1px solid var(--border);
}
.mode-tab {
  appearance: none; border: 1px solid transparent; border-radius: 9px;
  background: transparent; color: var(--text-2); cursor: pointer;
  min-height: 44px; padding: 8px 20px;
  font-size: 14px; font-weight: 600; letter-spacing: 2px;
  transition: color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.mode-tab:hover { color: var(--ink); transform: translateY(-1px); }
.mode-tab.active {
  color: var(--ink); background: var(--card-2);
  border-color: var(--border-strong);
  box-shadow: 0 2px 8px rgba(60, 55, 45, 0.08);
}
.mode-tab:focus-visible, .chest-option:focus-visible, .btn:focus-visible, input:focus-visible {
  outline: 2px solid var(--cinnabar); outline-offset: 2px;
}
.mode-panel[hidden] { display: none; }

/* 开箱账本 */
.card-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  margin-bottom: 16px;
}
.card-head h2 { margin-bottom: 3px; }
.sample-pill {
  flex-shrink: 0; align-self: center; padding: 4px 10px; border-radius: 999px;
  background: var(--accent-bg); color: var(--text-2); font-size: 11px; letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}
.chest-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chest-option {
  position: relative; min-height: 74px; padding: 14px 16px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--card-2); cursor: pointer; text-align: left;
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.chest-option:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
.chest-option.active { border-color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ink-2), var(--shadow); }
.chest-option .name { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 700; letter-spacing: 1px; }
.chest-option .name::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--chest-color, var(--ink-3));
}
.chest-option .meta { margin-top: 6px; color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.chest-cost-grid {
  display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: 12px;
  margin-top: 18px; align-items: end;
}
.cost-field { display: flex; flex-direction: column; gap: 6px; }
.cost-field > span { color: var(--text-2); font-size: 12px; letter-spacing: 1px; }
.cost-input {
  display: flex; align-items: center; overflow: hidden;
  border: 1px solid var(--border); border-radius: 10px; background: var(--card-2);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.cost-input:focus-within { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-bg); }
.cost-input input {
  width: 100%; min-height: 44px; border: 0; outline: none; background: transparent;
  padding: 10px 8px 10px 12px; color: var(--text); font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.cost-input span { padding: 0 12px 0 2px; color: var(--text-3); font-size: 12px; }
.cost-field small { min-height: 17px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chest-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.chest-metric {
  padding: 14px 15px; border: 1px solid var(--border); border-radius: 12px;
  background: linear-gradient(180deg, var(--card-2), var(--card));
}
.chest-metric .label { color: var(--text-2); font-size: 11px; letter-spacing: 1px; }
.chest-metric .value { margin-top: 4px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chest-metric .unit { margin-left: 3px; color: var(--text-3); font-size: 11px; font-weight: 400; }
.chest-metric .hint { margin-top: 3px; color: var(--text-3); font-size: 11px; }

/* 宝箱横向对比 */
.chest-compare { display: flex; flex-direction: column; gap: 8px; }
.chest-compare-row {
  display: grid; grid-template-columns: 1.25fr .9fr .9fr .9fr; gap: 10px; align-items: center;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-2);
  font-variant-numeric: tabular-nums;
}
.chest-compare-row.head { background: transparent; border-style: dashed; color: var(--text-3); font-size: 11px; letter-spacing: 1px; }
.chest-compare-row.selected { border-color: var(--border-strong); box-shadow: inset 3px 0 0 var(--cinnabar); }
.chest-compare-row .num { text-align: right; }
.craft-compare {
  margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--ink-3);
  color: var(--text-2); font-size: 12px; background: rgba(61,61,58,.035);
}

/* 掉落期望明细 */
.drop-details summary {
  min-height: 44px; display: flex; align-items: center; cursor: pointer;
  color: var(--ink); font-weight: 700; letter-spacing: 1px; list-style-position: inside;
}
.drop-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.drop-table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 12px; background: var(--card-2); }
.drop-table th, .drop-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.drop-table th { color: var(--text-3); font-weight: 500; letter-spacing: 1px; }
.drop-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.drop-table tr:last-child td { border-bottom: 0; }
.quality-tag { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; }
.quality-green { color: #667f61; background: #edf1e9; }
.quality-blue { color: #64798c; background: #edf1f3; }
.quality-purple { color: #756482; background: #f1edf2; }
.source-note {
  margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--border-strong); border-radius: 9px;
  color: var(--text-2); font-size: 12px; line-height: 1.7;
}
.source-note a { color: var(--ink-2); }

/* 采集收益 */
.gather-list { display: flex; flex-direction: column; gap: 12px; }
.gather-card {
  border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  background: var(--card-2); box-shadow: var(--shadow);
}
.gather-card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.gather-card .head .dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  background: var(--gather-color, var(--ink-3));
}
.gather-card .head .gname { font-weight: 700; font-size: 15px; letter-spacing: 1px; color: var(--ink); }
.gather-card .head .tag {
  margin-left: auto; font-size: 11px; color: var(--text-2);
  padding: 2px 9px; border-radius: 6px; background: var(--accent-bg);
}
.gather-card .summary { display: flex; flex-wrap: wrap; gap: 18px; margin: 8px 0 2px; font-size: 13px; color: var(--text-2); }
.gather-card .summary b { font-size: 15px; font-variant-numeric: tabular-nums; }
.gather-card .energy-row {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  padding: 8px 12px; border-radius: 9px; background: var(--card);
  font-size: 13px; color: var(--text-2);
}
.gather-card .energy-row input {
  width: 90px; min-height: 34px; padding: 5px 9px; text-align: right;
  border: 1px solid var(--border); border-radius: 8px; background: var(--card-2);
  color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; outline: none;
}
.gather-card .energy-row input:focus { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-bg); }
.gather-outputs { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.gather-output-row {
  display: grid; grid-template-columns: 1fr 90px 1fr 1fr; gap: 10px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px;
}
.gather-output-row:last-child { border-bottom: 0; }
.gather-output-row.header { background: var(--card); color: var(--text-3); font-size: 11px; letter-spacing: 1px; }
.gather-output-row .num { text-align: right; font-variant-numeric: tabular-nums; }
.gather-output-row input {
  width: 90px; min-height: 32px; padding: 4px 9px; text-align: right;
  border: 1px solid var(--border); border-radius: 7px; background: var(--card-2);
  color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; outline: none;
}
.gather-output-row input:focus { border-color: var(--ink-3); box-shadow: 0 0 0 3px var(--accent-bg); }
.gather-note { margin-top: 16px; }

/* 统计卡 */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
.metric {
  background: var(--card-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.metric::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--ink-2), var(--ink-3), transparent);
  opacity: 0.55;
}
.metric .label { font-size: 12px; color: var(--text-2); letter-spacing: 1px; }
.metric .value { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.metric .unit { font-size: 12px; color: var(--text-3); }

/* 收益榜列表 */
.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-item {
  border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  background: var(--card-2); cursor: pointer;
  box-shadow: 0 2px 8px rgba(80,60,30,.05);
  transition: box-shadow .2s, transform .2s, border-color .2s;
}
.rank-item:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); border-color: var(--border-strong); }
.rank-item .top { display: flex; align-items: center; gap: 12px; }
.rank-num {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; background: var(--bg); color: var(--text-2);
  font-family: var(--font-display);
}
.rank-num.top1 { background: var(--cinnabar); color: #fff; }
.rank-num.top2 { background: #e8e6e0; color: var(--ink-3); }
.rank-num.top3 { background: #ece6d8; color: #9a7a38; }
.rank-item .name { font-weight: 600; font-size: 14px; flex: 1; letter-spacing: 0.5px; }
.rank-item .craft-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 6px; flex-shrink: 0;
  letter-spacing: 1px;
}
.rank-item .profit { text-align: right; }
.rank-item .profit .big { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rank-item .profit .small { font-size: 11px; color: var(--text-3); }
.pos { color: var(--up); }
.neg { color: var(--down); }

.rank-item .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--text-2); }
.rank-item .meta .liq-good { color: var(--down); }
.rank-item .meta .liq-mid { color: var(--warn); }
.rank-item .meta .liq-bad { color: var(--up); }
.liq-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
.liq-good { background: #edf1e9; color: #6f8a6a; }
.liq-mid { background: #f3eedd; color: #a0803c; }
.liq-bad { background: #f6ece8; color: #b04a3a; }

/* 展开详情 */
.detail {
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
  display: none;
}
.detail.open { display: block; }
.detail h4 { font-size: 12px; color: var(--text-2); margin: 10px 0 6px; letter-spacing: 1px; }
.detail table { width: 100%; border-collapse: collapse; font-size: 12px; }
.detail th, .detail td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
.detail th { color: var(--text-3); font-weight: 400; }
.detail td.num { text-align: right; font-variant-numeric: tabular-nums; }
.detail .summary { font-size: 13px; color: var(--text-2); }

/* 提示 */
.tip { font-size: 12px; color: var(--text-3); margin-top: 8px; }
.empty { text-align: center; color: var(--text-3); padding: 40px 0; }

/* 分类筛选按钮 */
.craft-filter { display: flex; flex-wrap: wrap; gap: 8px; }

/* 角落淡墨竹枝 */
.corner-leaf {
  position: absolute; right: 4px; top: 4px;
  width: 82px; height: 82px; pointer-events: none; z-index: 0;
}
.has-leaf h2, .has-leaf .rank-list { position: relative; z-index: 1; }

/* 入场动画 */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
.header, .card, .metric {
  animation: riseIn var(--dur-base, 400ms) cubic-bezier(0.16, 1, 0.3, 1) both;
}
.card:nth-of-type(2) { animation-delay: 80ms; }
.card:nth-of-type(3) { animation-delay: 160ms; }
.metrics { animation-delay: 200ms; }

@media (max-width: 760px) {
  .chest-switch { grid-template-columns: 1fr; }
  .chest-cost-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chest-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  .rank-item .meta { gap: 8px; }
  .container { padding: 12px; }
  .header h1 { font-size: 22px; }
  .mode-tabs { margin: 0 0 14px; }
  .mode-tab { flex: 1; padding-inline: 8px; }
  .chest-cost-grid, .chest-metrics { grid-template-columns: 1fr; }
  .chest-compare-row { grid-template-columns: 1.2fr .8fr .8fr; }
  .chest-compare-row > :nth-child(4) { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <svg class="ink-wash" viewBox="0 0 640 150" fill="none" aria-hidden="true">
      <defs>
        <filter id="inkRough" x="-20%" y="-40%" width="140%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045 0.09" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur stdDeviation="2.2"/>
        </filter>
        <radialGradient id="inkBody" cx="42%" cy="50%" r="62%">
          <stop offset="0%" stop-color="#33322e" stop-opacity="0.20"/>
          <stop offset="55%" stop-color="#33322e" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#33322e" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g filter="url(#inkRough)">
        <ellipse cx="300" cy="70" rx="270" ry="40" fill="url(#inkBody)"/>
        <ellipse cx="250" cy="66" rx="180" ry="26" fill="#33322e" opacity="0.06"/>
      </g>
      <!-- 淡墨远山 -->
      <path d="M-10 46 L52 24 L104 42 L168 16 L232 40 L300 22 L362 44 L362 64 L-10 64 Z"
            fill="#33322e" opacity="0.07"/>
      <path d="M300 40 L352 24 L410 44 L470 30 L470 58 L300 58 Z"
            fill="#33322e" opacity="0.05"/>
      <!-- 鹤群（纯阳意象，渐远渐小） -->
      <g fill="none" stroke="#33322e" stroke-linecap="round">
        <path d="M498 40 q7 -8 14 0 q7 -8 14 0" stroke-width="2.2" stroke-opacity="0.42"/>
        <path d="M540 30 q5 -6 10 0 q5 -6 10 0" stroke-width="1.8" stroke-opacity="0.34"/>
        <path d="M470 52 q4 -5 8 0 q4 -5 8 0" stroke-width="1.5" stroke-opacity="0.26"/>
      </g>
      <path d="M70 108 C 220 100, 420 100, 560 104" stroke="#33322e" stroke-opacity="0.10" stroke-width="4" stroke-linecap="round" filter="url(#inkRough)"/>
      <circle cx="566" cy="52" r="4.5" fill="#33322e" opacity="0.12"/>
      <circle cx="582" cy="60" r="2.4" fill="#33322e" opacity="0.14"/>
      <circle cx="60" cy="58" r="3" fill="#33322e" opacity="0.08"/>
    </svg>
    <h1>搬砖小算盘<span class="seal">搬砖</span></h1>
    <div class="sub">今天，搬哪块砖最划算？—— 输入技艺等级，看看哪门手艺最赚精力</div>
    <div class="badge-row" id="badgeRow"></div>
  </div>

  <nav class="mode-tabs" aria-label="收益测算类型">
    <button type="button" class="mode-tab active" id="craftTab" data-mode="craft" aria-selected="true" aria-controls="craftPanel">技艺收益</button>
    <button type="button" class="mode-tab" id="chestTab" data-mode="chest" aria-selected="false" aria-controls="chestPanel">宝箱测算</button>
    <button type="button" class="mode-tab" id="gatherTab" data-mode="gather" aria-selected="false" aria-controls="gatherPanel">采集收益</button>
  </nav>

  <main>
  <section class="mode-panel" id="craftPanel" aria-labelledby="craftTab">
  <div class="card">
    <h2>你的技艺等级</h2>
    <div class="craft-inputs" id="craftInputs"></div>
    <div class="tip">专精：勾选表示该号已学习该技艺专精，可制作需要专精的配方。等级填你实际拥有的技艺等级，低于该等级的配方会被过滤掉。</div>
  </div>

  <div class="card">
    <h2>筛选与排序</h2>
    <div class="controls">
      <div class="craft-filter" id="craftFilter"></div>
    </div>
    <div class="controls" style="margin-top:10px;">
      <select class="filter" id="sortBy">
        <option value="profit_per_energy">按每点精力净利排序</option>
        <option value="profit">按单次净利排序</option>
        <option value="liquidity">按流动性排序</option>
      </select>
      <select class="filter" id="liqFilter">
        <option value="all">全部流动性</option>
        <option value="good">只看流动性好</option>
        <option value="ok">只看流动性中等以上</option>
      </select>
    </div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="card has-leaf">
    <svg class="corner-leaf" viewBox="0 0 80 80" fill="none" aria-hidden="true">
      <g stroke="#33322e" stroke-opacity="0.12" stroke-width="1.6" stroke-linecap="round">
        <path d="M72 6 C 52 20, 42 42, 40 74"/>
        <path d="M60 22 q-12 -3 -20 4"/>
        <path d="M52 38 q-12 0 -18 9"/>
        <path d="M64 16 q2 -12 11 -15"/>
        <path d="M46 52 q-10 3 -13 13"/>
        <path d="M58 30 q10 -2 14 -10"/>
      </g>
    </svg>
    <h2 id="rankTitle">收益榜</h2>
    <div class="rank-list" id="rankList"></div>
  </div>
  </section>

  <section class="mode-panel" id="chestPanel" aria-labelledby="chestTab" hidden>
    <div class="card">
      <div class="card-head">
        <div>
          <h2>开箱账本</h2>
          <div class="tip" id="chestFormula">单箱净利 = 材料期望产值 × 95% − 宝箱价 − 钥匙价</div>
        </div>
        <span class="sample-pill" id="chestSample"></span>
      </div>

      <div class="chest-switch" id="chestSwitch" role="tablist" aria-label="选择宝箱类型"></div>

      <div class="chest-cost-grid">
        <label class="cost-field">
          <span>宝箱单价</span>
          <div class="cost-input"><input type="number" id="chestPrice" min="0" step="0.01" inputmode="decimal"><span>金</span></div>
          <small id="chestMarket"></small>
        </label>
        <label class="cost-field">
          <span id="keyPriceLabel">钥匙单价</span>
          <div class="cost-input"><input type="number" id="keyPrice" min="0" step="0.01" inputmode="decimal"><span>金</span></div>
          <small id="keyMarket"></small>
        </label>
        <label class="cost-field">
          <span>计划开箱</span>
          <div class="cost-input"><input type="number" id="openCount" min="1" max="9999" step="1" value="20" inputmode="numeric"><span>箱</span></div>
          <small>按长期期望估算总账</small>
        </label>
        <button type="button" class="btn" id="resetChestPrice">恢复实时价</button>
      </div>

      <div class="chest-metrics" id="chestMetrics"></div>
    </div>

    <div class="card">
      <h2>三种宝箱横向比</h2>
      <div class="chest-compare" id="chestCompare"></div>
      <div class="craft-compare" id="craftCompare"></div>
    </div>

    <div class="card">
      <details class="drop-details">
        <summary>单箱掉落期望明细</summary>
        <div class="drop-table-wrap">
          <table class="drop-table">
            <thead><tr><th>材料</th><th>品质</th><th>实测概率</th><th>当前单价</th><th>税后期望贡献</th></tr></thead>
            <tbody id="dropRows"></tbody>
          </table>
        </div>
      </details>
      <div class="source-note" id="chestSourceNote"></div>
    </div>
  </section>

  <section class="mode-panel" id="gatherPanel" aria-labelledby="gatherTab" hidden>
    <div class="card">
      <div class="card-head">
        <div>
          <h2>采集收益</h2>
          <div class="tip">采集消耗「体力」，与制造/宝箱消耗的「精力」是两套独立资源，故此处单列、不与其混比。</div>
        </div>
      </div>
      <div class="gather-list" id="gatherList"></div>
      <div class="source-note gather-note" id="gatherNote"></div>
    </div>
  </section>
  </main>
</div>

<script>
const CRAFT_COLORS = {
  cooking: '#6f8a6a',      // 青灰绿（竹青）
  medicine: '#6b7f8e',     // 黛青（青黛）
  tailoring: '#8a6a5c',    // 赭石（浅绛）
  founding: '#a0803c',     // 藤黄赭
  furniture: '#7d6a8a',    // 紫檀灰
};
const CRAFT_NAMES = {
  cooking: '烹饪', medicine: '制药', tailoring: '缝纫',
  founding: '锻造', furniture: '梓匠',
};
// 水墨线条图标（stroke 用 currentColor，随技艺配色）
const CRAFT_ICONS = {
  cooking: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M2.5 10h19"/><path d="M9 6.5c0-1 1-1.2 1-2.2M14 6.5c0-1 1-1.2 1-2.2"/></svg>`,
  medicine: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v2a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z"/><path d="M12 11V5l4-1.5"/><path d="M4 20h16"/></svg>`,
  tailoring: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L16 8"/><path d="M16 8l3-3"/><circle cx="17.5" cy="6.5" r="1.3"/><path d="M5 19c-1.5 2 .5 3.5 2.5 2.5S10 18 13 18"/></svg>`,
  founding: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6"/><path d="M18 6l2-2"/><path d="M5 13l6 6"/><path d="M4 20l3-3"/></svg>`,
  furniture: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M12 4v16M4 12h16"/></svg>`,
};
const CRAFT_KEYS = ['cooking', 'medicine', 'tailoring', 'founding', 'furniture'];
const CHEST_COLORS = {
  bronze: '#8a6a5c',
  tin: '#6b7f8e',
  iron: '#3d3d3a',
};

let DATA = null;
let state = {
  levels: { cooking: 0, medicine: 0, tailoring: 0, founding: 0, furniture: 0 },
  expertise: { cooking: false, medicine: false, tailoring: false, founding: false, furniture: false },
  craftFilter: 'all',
  sortBy: 'profit_per_energy',
  liqFilter: 'all',
  mode: 'craft',
  chestKey: 'bronze',
  chestCosts: {},
  gatherOverrides: {},
};

function fmtJin(v) {
  // v 单位是万分之一金，转换为金
  const jin = v / 10000;
  if (jin >= 10000) return (jin / 10000).toFixed(2) + '万';
  if (jin >= 1) return jin.toFixed(2);
  return jin.toFixed(4);
}
function fmtJin2(v) {
  const jin = v / 10000;
  return jin.toFixed(2);
}
function fmtJin4(v) {
  const jin = v / 10000;
  return jin >= 100 ? jin.toFixed(2) : jin.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
}
function fmtSignedJin(v) {
  return (v >= 0 ? '+' : '') + fmtJin2(v);
}
function fmtPercent(v) {
  return (v * 100).toFixed(2) + '%';
}
function formatCount(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return String(n);
}
function profitClass(v) {
  return v >= 0 ? 'pos' : 'neg';
}

function liquidityTag(count) {
  if (count >= 500) return { text: '充足', cls: 'liq-good' };
  if (count >= 50) return { text: '一般', cls: 'liq-mid' };
  return { text: '稀少', cls: 'liq-bad' };
}

function renderBadges() {
  if (!DATA) return;
  const el = document.getElementById('badgeRow');
  const t = new Date(DATA.generated_at * 1000);
  const timeStr = `${t.getMonth()+1}月${t.getDate()}日 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  el.innerHTML = '';
  const badges = [
    `区服：${DATA.server}`,
    `更新时间：${timeStr}`,
    `可计算配方：${DATA.recipes.length} 个`,
    `可测算宝箱：${(DATA.chests || []).length} 种`,
    `手续费：${(DATA.fee_rate*100).toFixed(0)}%`,
  ];
  badges.forEach(b => {
    const span = document.createElement('span');
    span.className = 'badge';
    span.textContent = b;
    el.appendChild(span);
  });
}

function renderCraftInputs() {
  const el = document.getElementById('craftInputs');
  el.innerHTML = '';
  CRAFT_KEYS.forEach(key => {
    const div = document.createElement('div');
    div.className = 'craft-input';
    const color = CRAFT_COLORS[key];
    div.innerHTML = `
      <div class="craft-name"><span class="craft-ico" style="color:${color}">${CRAFT_ICONS[key]}</span>${CRAFT_NAMES[key]}</div>
      <input type="number" min="0" max="50" placeholder="等级" data-key="${key}" value="${state.levels[key] || ''}">
      <label class="switch">
        <input type="checkbox" data-exp="${key}" ${state.expertise[key] ? 'checked' : ''}>
        <span class="toggle-track"></span>
        <span>专精</span>
      </label>
    `;
    el.appendChild(div);
  });

  el.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.key;
      state.levels[key] = parseInt(inp.value) || 0;
      update();
    });
  });
  el.querySelectorAll('label.switch').forEach(lb => {
    lb.addEventListener('click', (e) => {
      e.preventDefault(); // 阻止 label 默认联动，避免双重切换
      const cb = lb.querySelector('input[type=checkbox]');
      cb.checked = !cb.checked;
      const key = cb.dataset.exp;
      state.expertise[key] = cb.checked;
      update();
    });
  });
}

function renderCraftFilter() {
  const el = document.getElementById('craftFilter');
  el.innerHTML = '';
  const opts = [
    { key: 'all', name: '全部' },
    ...CRAFT_KEYS.map(k => ({ key: k, name: CRAFT_NAMES[k] })),
  ];
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'btn' + (state.craftFilter === o.key ? ' active' : '');
    btn.textContent = o.name;
    btn.addEventListener('click', () => {
      state.craftFilter = o.key;
      renderCraftFilter();
      update();
    });
    el.appendChild(btn);
  });
}

function filterRecipes() {
  if (!DATA) return [];
  const rows = DATA.recipes.filter(r => {
    // 等级过滤
    const lvl = r.require_level || 0;
    if (lvl > (state.levels[r.craft] || 0)) return false;
    // 专精过滤
    if (r.need_expertise && !state.expertise[r.craft]) return false;
    // 分类过滤
    if (state.craftFilter !== 'all' && r.craft !== state.craftFilter) return false;
    // 流动性过滤
    if (state.liqFilter === 'good' && r.liquidity < 500) return false;
    if (state.liqFilter === 'ok' && r.liquidity < 50) return false;
    return true;
  });

  const sortKey = state.sortBy;
  rows.sort((a, b) => b[sortKey] - a[sortKey]);
  return rows;
}

function renderMetrics(rows) {
  const el = document.getElementById('metrics');
  if (rows.length === 0) {
    el.innerHTML = '';
    return;
  }
  const pos = rows.filter(r => r.profit > 0).length;
  const top = rows[0];
  const avg = rows.reduce((s, r) => s + r.profit_per_energy, 0) / rows.length;
  el.innerHTML = `
    <div class="metric"><div class="label">可做配方</div><div class="value">${rows.length}</div><div class="unit">个</div></div>
    <div class="metric"><div class="label">正收益</div><div class="value">${pos}</div><div class="unit">个</div></div>
    <div class="metric"><div class="label">最优配方</div><div class="value" style="font-size:16px">${top.name}</div><div class="unit">${fmtJin2(top.profit_per_energy)} 金/精力</div></div>
    <div class="metric"><div class="label">平均每精力净利</div><div class="value">${fmtJin2(avg)}</div><div class="unit">金</div></div>
  `;
}

function renderList(rows) {
  const el = document.getElementById('rankList');
  const title = document.getElementById('rankTitle');
  if (rows.length === 0) {
    title.textContent = '收益榜（无匹配配方）';
    el.innerHTML = '<div class="empty">没有符合当前等级的配方，试试提高等级或切换分类</div>';
    return;
  }
  title.textContent = `收益榜（共 ${rows.length} 个可做配方）`;
  el.innerHTML = '';
  rows.slice(0, 200).forEach((r, i) => {
    const liq = liquidityTag(r.liquidity);
    const isPos = r.profit >= 0;
    const div = document.createElement('div');
    div.className = 'rank-item';
    const rankCls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    div.innerHTML = `
      <div class="top">
        <div class="rank-num ${rankCls}">${i+1}</div>
        <div class="name">${r.name}</div>
        <div class="craft-tag" style="background:${CRAFT_COLORS[r.craft]}18;color:${CRAFT_COLORS[r.craft]}">${r.craft_name}</div>
        <div class="profit">
          <div class="big ${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}${fmtJin2(r.profit_per_energy)}</div>
          <div class="small">金/精力</div>
        </div>
      </div>
      <div class="meta">
        <span>需等级 ${r.require_level || '-'}</span>
        ${r.need_expertise ? '<span>需专精</span>' : ''}
        <span>消耗精力 ${r.energy}</span>
        <span>单次净利 ${r.profit >= 0 ? '+' : ''}${fmtJin2(r.profit)} 金</span>
        <span class="${liq.cls}">流动性 ${liq.text}</span>
      </div>
      <div class="detail" data-id="${i}"></div>
    `;
    div.querySelector('.top').addEventListener('click', () => toggleDetail(div, r, i));
    el.appendChild(div);
  });
}

function toggleDetail(container, r, i) {
  const detail = container.querySelector('.detail');
  if (detail.classList.contains('open')) {
    detail.classList.remove('open');
    return;
  }
  detail.classList.add('open');
  if (detail.innerHTML) return;

  let matHtml = '';
  r.materials.forEach(m => {
    matHtml += `<tr><td>${m.name}</td><td class="num">${m.count}</td><td class="num">${fmtJin(m.unit_price)}</td><td class="num">${fmtJin(m.cost)}</td></tr>`;
  });
  let outHtml = '';
  r.outputs.forEach(o => {
    outHtml += `<tr><td>${o.name}</td><td class="num">${o.min}~${o.max}</td><td class="num">${fmtJin(o.unit_price)}</td><td class="num">${fmtJin(o.revenue)}</td></tr>`;
  });

  detail.innerHTML = `
    <div class="summary">
      材料成本 <b>${fmtJin2(r.material_cost)}</b> 金 · 成品产值 <b>${fmtJin2(r.expected_revenue)}</b> 金 · 
      扣手续费后净利 <b>${fmtJin2(r.net_revenue)}</b> 金
    </div>
    <h4>材料（${r.materials.length} 种）</h4>
    <table><thead><tr><th>材料</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody>${matHtml}</tbody></table>
    <h4>产出（${r.outputs.length} 种）</h4>
    <table><thead><tr><th>成品</th><th>产出数量</th><th>单价</th><th>小计</th></tr></thead><tbody>${outHtml}</tbody></table>
  `;
}

function getChests() {
  return (DATA && DATA.chests) ? DATA.chests : [];
}
function selectedChest() {
  const chests = getChests();
  return chests.find(c => c.key === state.chestKey) || chests[0];
}
function marketCosts(chest) {
  return {
    chest: chest.chest_price / 10000,
    key: chest.key_price / 10000,
  };
}
function initChestState() {
  getChests().forEach(chest => {
    if (!state.chestCosts[chest.key]) state.chestCosts[chest.key] = marketCosts(chest);
  });
}
function renderChestSwitch() {
  const el = document.getElementById('chestSwitch');
  el.innerHTML = '';
  getChests().forEach(chest => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chest-option' + (chest.key === state.chestKey ? ' active' : '');
    btn.style.setProperty('--chest-color', CHEST_COLORS[chest.key] || '#6f6e68');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', chest.key === state.chestKey ? 'true' : 'false');
    btn.innerHTML = `
      <div class="name">${chest.name}</div>
      <div class="meta">消耗 ${chest.energy} 精力 · 实测 ${formatCount(chest.sample)} 箱</div>
    `;
    btn.addEventListener('click', () => {
      if (state.chestKey === chest.key) return;
      state.chestKey = chest.key;
      renderChestSwitch();
      syncChestInputs();
      updateChest();
    });
    el.appendChild(btn);
  });
}
function syncChestInputs() {
  const chest = selectedChest();
  if (!chest) return;
  const costs = state.chestCosts[chest.key] || marketCosts(chest);
  document.getElementById('chestPrice').value = Number(costs.chest.toFixed(4)).toString();
  document.getElementById('keyPrice').value = Number(costs.key.toFixed(4)).toString();
  document.getElementById('keyPriceLabel').textContent = `${chest.key_name}单价`;
  document.getElementById('chestSample').textContent = `样本 ${formatCount(chest.sample)} · ${chest.energy} 精力/箱`;
  document.getElementById('chestMarket').textContent =
    `最低 ${fmtJin4(chest.chest_price)} 金 · 挂单 ${formatCount(chest.chest_liquidity)}`;
  document.getElementById('keyMarket').textContent =
    `最低 ${fmtJin4(chest.key_price)} 金 · 挂单 ${formatCount(chest.key_liquidity)}`;
}
function readChestInputs() {
  const chest = selectedChest();
  if (!chest) return;
  const chestPrice = parseFloat(document.getElementById('chestPrice').value);
  const keyPrice = parseFloat(document.getElementById('keyPrice').value);
  state.chestCosts[chest.key] = {
    chest: Number.isFinite(chestPrice) && chestPrice >= 0 ? chestPrice : 0,
    key: Number.isFinite(keyPrice) && keyPrice >= 0 ? keyPrice : 0,
  };
}
function calculateChest(chest) {
  const costs = state.chestCosts[chest.key] || marketCosts(chest);
  const cost = (costs.chest + costs.key) * 10000;
  const profit = chest.net_revenue - cost;
  return {
    chest,
    costs,
    cost,
    profit,
    profitPerEnergy: profit / chest.energy,
    breakEvenTotal: chest.net_revenue,
    breakEvenChest: chest.net_revenue - costs.key * 10000,
  };
}
function calculateAllChests() {
  return getChests().map(calculateChest);
}
function renderChestMetrics(calc) {
  const el = document.getElementById('chestMetrics');
  const count = Math.max(1, parseInt(document.getElementById('openCount').value, 10) || 1);
  const totalProfit = calc.profit * count;
  el.innerHTML = `
    <div class="chest-metric">
      <div class="label">税后材料产值</div>
      <div class="value">${fmtJin2(calc.chest.net_revenue)}<span class="unit">金/箱</span></div>
      <div class="hint">按当前材料价与实测概率</div>
    </div>
    <div class="chest-metric">
      <div class="label">单箱期望净利</div>
      <div class="value ${profitClass(calc.profit)}">${fmtSignedJin(calc.profit)}<span class="unit">金</span></div>
      <div class="hint">箱 ${calc.costs.chest.toFixed(2)} 金 · 钥匙 ${calc.costs.key.toFixed(2)} 金</div>
    </div>
    <div class="chest-metric">
      <div class="label">每点精力期望</div>
      <div class="value ${profitClass(calc.profitPerEnergy)}">${fmtSignedJin(calc.profitPerEnergy)}<span class="unit">金</span></div>
      <div class="hint">每箱消耗 ${calc.chest.energy} 点</div>
    </div>
    <div class="chest-metric">
      <div class="label">${count} 箱期望总净利</div>
      <div class="value ${profitClass(totalProfit)}">${fmtSignedJin(totalProfit)}<span class="unit">金</span></div>
      <div class="hint">长期均值，短期有欧非波动</div>
    </div>
    <div class="chest-metric">
      <div class="label">回本箱匙总价</div>
      <div class="value">${fmtJin2(calc.breakEvenTotal)}<span class="unit">金</span></div>
      <div class="hint">当前钥匙价下，宝箱 ≤ ${fmtJin2(calc.breakEvenChest)} 金</div>
    </div>
  `;
}
function renderChestCompare(calculations) {
  const el = document.getElementById('chestCompare');
  const rows = [...calculations].sort((a, b) => b.profitPerEnergy - a.profitPerEnergy);
  el.innerHTML = `
    <div class="chest-compare-row head">
      <div>宝箱</div><div class="num">单箱净利</div><div class="num">净利/精力</div><div class="num">回本总价</div>
    </div>
  `;
  rows.forEach(calc => {
    const row = document.createElement('div');
    row.className = 'chest-compare-row' + (calc.chest.key === state.chestKey ? ' selected' : '');
    row.innerHTML = `
      <div>${calc.chest.name}</div>
      <div class="num ${profitClass(calc.profit)}">${fmtSignedJin(calc.profit)} 金</div>
      <div class="num ${profitClass(calc.profitPerEnergy)}">${fmtSignedJin(calc.profitPerEnergy)} 金</div>
      <div class="num">${fmtJin2(calc.breakEvenTotal)} 金</div>
    `;
    row.addEventListener('click', () => {
      if (state.chestKey === calc.chest.key) return;
      state.chestKey = calc.chest.key;
      renderChestSwitch();
      syncChestInputs();
      updateChest();
    });
    el.appendChild(row);
  });
}
function renderCraftCompare(bestChest) {
  const el = document.getElementById('craftCompare');
  const rows = filterRecipes();
  if (!rows.length) {
    el.textContent = '填好技艺等级后，这里会直接对比「最优手艺」和当前宝箱的每点精力收益。';
    return;
  }
  const top = rows[0];
  const diff = bestChest.profitPerEnergy - top.profit_per_energy;
  const relation = diff >= 0 ? `高 ${fmtJin2(diff)}` : `低 ${fmtJin2(Math.abs(diff))}`;
  el.innerHTML = `当前最优手艺：<b>${top.name}</b>（${fmtJin2(top.profit_per_energy)} 金/精力）；
    所选宝箱每点精力比它${relation} 金。`;
}
function renderDropTable(chest) {
  const el = document.getElementById('dropRows');
  const fee = 1 - (DATA.fee_rate || 0);
  el.innerHTML = chest.drops.map(d => `
    <tr>
      <td>${d.name}</td>
      <td><span class="quality-tag quality-${d.quality}">${d.quality_name}</span></td>
      <td class="num">${fmtPercent(d.probability)}</td>
      <td class="num">${fmtJin4(d.unit_price)} 金</td>
      <td class="num">${fmtJin4(d.contribution * fee)} 金</td>
    </tr>
  `).join('');
}
function renderChestSource(chest) {
  const source = DATA.chest_source || {};
  const url = source.url || '#';
  document.getElementById('chestSourceNote').innerHTML =
    `概率来源：<a href="${url}" target="_blank" rel="noopener noreferrer">魔盒《${source.title || '宝箱开材料数据分享'}》</a>` +
    `（${source.collected_at || '历史'}实测，${source.published_at || '近期'}分享）。` +
    `当前选择「材料」分支，不含书籍、秘籍、五行石；材料卖出已扣 ${(DATA.fee_rate * 100).toFixed(0)}% 手续费。` +
    (chest.key === 'iron' ? '精铁样本仅 2,718 箱，明显少于另外两种，误差会更大。' : '青铜与锡制样本较大，概率参考更稳定。') +
    '期望收益是长期均值，不代表少量开箱必赚。';
}
function updateChest() {
  const chest = selectedChest();
  if (!chest) return;
  readChestInputs();
  const calculations = calculateAllChests();
  const selected = calculations.find(c => c.chest.key === chest.key);
  renderChestMetrics(selected);
  renderChestCompare(calculations);
  renderCraftCompare(selected);
  renderDropTable(chest);
  renderChestSource(chest);
}

/* ===== 采集收益 ===== */
function getGathers() {
  return (DATA && DATA.gathers) ? DATA.gathers : [];
}
function gatherOverride(gather) {
  if (!state.gatherOverrides[gather.key]) {
    state.gatherOverrides[gather.key] = {
      energy: gather.energy,
      counts: {},
    };
    gather.outputs.forEach(o => { state.gatherOverrides[gather.key].counts[o.item_id] = o.count; });
  }
  return state.gatherOverrides[gather.key];
}
function calcGather(gather) {
  const ov = gatherOverride(gather);
  const fee = 1 - (DATA.fee_rate || 0);
  const outputs = gather.outputs.map(o => {
    const count = ov.counts[o.item_id] != null ? ov.counts[o.item_id] : o.count;
    return { ...o, count, revenue: o.unit_price * count };
  });
  const revenue = outputs.reduce((s, o) => s + o.revenue, 0);
  const net = revenue * fee;
  const energy = ov.energy;
  return { outputs, revenue, net, energy, perEnergy: net / energy };
}
function renderGatherList() {
  const el = document.getElementById('gatherList');
  const fee = 1 - (DATA.fee_rate || 0);
  el.innerHTML = '';
  getGathers().forEach(gather => {
    const card = document.createElement('div');
    card.className = 'gather-card';
    card.style.setProperty('--gather-color', gather.color || '#6f6e68');
    const calc = calcGather(gather);

    const mainRows = gather.outputs.map(o => {
      const count = state.gatherOverrides[gather.key].counts[o.item_id] != null
        ? state.gatherOverrides[gather.key].counts[o.item_id] : o.count;
      return `
        <div class="gather-output-row" data-item="${o.item_id}">
          <div>${o.name}</div>
          <div class="num"><input type="number" min="0" step="1" value="${count}" data-item="${o.item_id}" aria-label="${o.name} 产出数量"></div>
          <div class="num">${fmtJin4(o.unit_price)} 金</div>
          <div class="num">${fmtJin4(o.unit_price * count * fee)} 金</div>
        </div>`;
    }).join('');

    const sideRows = (gather.side_outputs || []).map(o => `
      <div class="gather-output-row" style="opacity:.85">
        <div>${o.name} <span class="quality-tag quality-blue">伴生</span></div>
        <div class="num">—</div>
        <div class="num">${fmtJin4(o.unit_price)} 金</div>
        <div class="num" style="color:var(--text-3)">概率产出</div>
      </div>`).join('');

    const newRows = (gather.new_materials || []).map(o => `
      <div class="gather-output-row" style="opacity:.85">
        <div>${o.name} <span class="quality-tag quality-purple">新版</span></div>
        <div class="num">—</div>
        <div class="num">${fmtJin4(o.unit_price)} 金</div>
        <div class="num" style="color:var(--text-3)">高阶采集</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="head">
        <span class="dot"></span>
        <span class="gname">${gather.name}</span>
        <span class="tag">${gather.energy_unit} · 每点 ${fmtSignedJin(calc.perEnergy)} 金</span>
      </div>
      <div class="summary">
        <span>税后主产值 <b class="${profitClass(calc.net)}">${fmtJin2(calc.net)}</b> 金/次</span>
        <span>主产出 ${gather.outputs.length} 种</span>
      </div>
      <div class="energy-row">
        <span>每次消耗</span>
        <input type="number" min="1" step="1" value="${state.gatherOverrides[gather.key].energy}" data-energy="${gather.key}" aria-label="${gather.name} 每次体力消耗">
        <span>${gather.energy_unit}</span>
      </div>
      <div class="gather-outputs">
        <div class="gather-output-row header">
          <div>主产出</div><div class="num">每次数量</div><div class="num">单价</div><div class="num">税后小计</div>
        </div>
        ${mainRows}
        ${sideRows}
        ${newRows}
      </div>
    `;
    el.appendChild(card);
  });

  el.querySelectorAll('input[data-energy]').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.energy;
      state.gatherOverrides[key].energy = parseInt(inp.value, 10) || 1;
      renderGatherList();
    });
  });
  el.querySelectorAll('input[data-item]').forEach(inp => {
    inp.addEventListener('input', () => {
      const itemId = inp.dataset.item;
      const key = findGatherKeyByItem(itemId);
      if (key) {
        state.gatherOverrides[key].counts[itemId] = parseInt(inp.value, 10) || 0;
        renderGatherList();
      }
    });
  });
}
function findGatherKeyByItem(itemId) {
  for (const g of getGathers()) {
    if (g.outputs.some(o => o.item_id === itemId)) return g.key;
  }
  return null;
}
function renderGatherNote() {
  const version = (DATA.gather_source && DATA.gather_source.version) || '苍生铸世';
  document.getElementById('gatherNote').innerHTML =
    `<b>${version}</b> 版本 · 采集消耗「体力」，产出数量与体力消耗随技艺等级/采集目标浮动，此处为常见值预置，可直接改数量与体力。` +
    `伴生物（硼砂/辉石/露水/云芝/宝石等）为概率产出，官方未公布精确概率，单列不计入主收益。` +
    `材料价格走交易行实时最低挂单价，卖出已扣 ${(DATA.fee_rate * 100).toFixed(0)}% 手续费。`;
}
function initGather() {
  if (!getGathers().length) {
    document.getElementById('gatherTab').hidden = true;
    return;
  }
  renderGatherList();
  renderGatherNote();
}
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-tab').forEach(btn => {
    const active = btn.dataset.mode === mode;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  document.getElementById('craftPanel').hidden = mode !== 'craft';
  document.getElementById('chestPanel').hidden = mode !== 'chest';
  document.getElementById('gatherPanel').hidden = mode !== 'gather';
  if (mode === 'chest') updateChest();
  if (mode === 'gather') renderGatherList();
}
function initChestControls() {
  if (!getChests().length) {
    document.getElementById('chestTab').hidden = true;
    return;
  }
  initChestState();
  renderChestSwitch();
  syncChestInputs();
  ['chestPrice', 'keyPrice', 'openCount'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateChest);
  });
  document.getElementById('resetChestPrice').addEventListener('click', () => {
    const chest = selectedChest();
    state.chestCosts[chest.key] = marketCosts(chest);
    syncChestInputs();
    updateChest();
  });
  updateChest();
}

function update() {
  const rows = filterRecipes();
  renderMetrics(rows);
  renderList(rows);
  if (state.mode === 'chest') updateChest();
}

function init() {
  document.getElementById('sortBy').addEventListener('change', e => {
    state.sortBy = e.target.value;
    update();
  });
  document.getElementById('liqFilter').addEventListener('change', e => {
    state.liqFilter = e.target.value;
    update();
  });
  document.getElementById('craftTab').addEventListener('click', () => setMode('craft'));
  document.getElementById('chestTab').addEventListener('click', () => setMode('chest'));
  document.getElementById('gatherTab').addEventListener('click', () => setMode('gather'));
}

fetch('recipe_data.json').then(res => res.json()).then(data => {
  DATA = data;
  renderBadges();
  renderCraftInputs();
  renderCraftFilter();
  init();
  initChestControls();
  initGather();
  update();
}).catch(err => {
  document.getElementById('rankList').innerHTML = '<div class="empty">数据加载失败，请稍后刷新重试</div>';
});
</script>
</body>
</html>
